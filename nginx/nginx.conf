worker_processes auto;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;

  # gzip text + json; downloads (csv/parquet) benefit too
  gzip on;
  gzip_types text/plain text/css application/javascript application/json text/csv;
  gzip_min_length 1024;

  upstream portal_app { server web:8000; }

  server {
    listen 80;
    server_name _;
    client_max_body_size 4m;

    # static assets (incl. the vendored plotly.min.js) live in the app image;
    # proxy them so we don't duplicate the volume — cache aggressively.
    location /static/ {
      proxy_pass http://portal_app;
      proxy_set_header Host $host;
      expires 7d;
      add_header Cache-Control "public";
    }

    # bulk-download files (baked into the app image); proxied to the app which
    # serves them as attachments. gzip above compresses csv/json on the wire.
    location /downloads/ {
      proxy_pass http://portal_app;
      proxy_set_header Host $host;
      proxy_read_timeout 120s;
      expires 1d;
    }

    # API + app
    location / {
      proxy_pass http://portal_app;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
