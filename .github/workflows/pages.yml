name: Deploy portal to GitHub Pages

# Builds the static site from the committed parquet (etl/prerender.py) and
# deploys it to GitHub Pages. One-time manual step: repo Settings -> Pages ->
# Source = "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# allow one concurrent deploy; don't cancel an in-progress one
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # part of the suite asserts against the committed parquet rather than
          # a fixture, so the LFS objects have to be here too (see build below).
          lfs: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  build:
    # a failing suite must not reach Pages
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # data/parquet/ is tracked in LFS (.gitattributes) and prerender reads
          # it directly. checkout does not fetch LFS objects by default, so
          # without this the build gets pointer files instead of tables.
          lfs: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Pre-render static site
        run: python etl/prerender.py --out site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
          # keep .nojekyll, which this action drops by default from v4 on
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
