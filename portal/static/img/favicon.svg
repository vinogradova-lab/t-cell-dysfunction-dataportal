<?xml version="1.0" encoding="UTF-8"?>
<!-- Lab T cell mark, used as the browser tab icon. Same artwork as t_cell.svg,
     with two favicon-specific changes:

     1. Squared viewBox. The source is 10.76 x 11.11, which a square favicon
        slot would stretch. Padding the viewport rather than transforming the
        content leaves the userSpaceOnUse gradients aligned with their paths.
     2. The two wrapper opacities (.85 and .9, compounding to .765) are set to
        1. They soften the mark at display size, but over the white-centred
        radial gradient they wash it out to a featureless blob at 16px; at full
        opacity the inner cell body stays legible in a tab. Shapes and colours
        are otherwise untouched. -->
<svg id="Layer_2" data-name="Layer 2" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="-.175 0 11.11 11.11">
  <title>T cell dysfunction data portal</title>
  <defs>
    <style>
      .cls-1 {
        fill: url(#linear-gradient-2);
      }

      .cls-2 {
        fill: url(#radial-gradient);
        stroke: url(#linear-gradient);
        stroke-miterlimit: 10;
        stroke-width: .15px;
      }

      .cls-3 {
        fill: #ef8444;
      }

      .cls-4 {
        opacity: 1;
      }

      .cls-5 {
        opacity: 1;
      }

      .cls-6 {
        opacity: .5;
      }
    </style>
    <radialGradient id="radial-gradient" cx="455.71" cy="119.1" fx="455.71" fy="119.1" r="13.5" gradientTransform="translate(-242.44 -50.19) rotate(-2.86) scale(.54 .57)" gradientUnits="userSpaceOnUse">
